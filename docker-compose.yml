name: atlas-literario

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: atlas_literario
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atlas} -d atlas_literario"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:5080
      ConnectionStrings__Default: Host=db;Port=5432;Database=atlas_literario;Username=${POSTGRES_USER:-atlas};Password=${POSTGRES_PASSWORD:-atlas_dev_password}
      Jwt__Secret: ${JWT_SECRET:?defina JWT_SECRET no .env}
      Jwt__Issuer: atlas-literario
      Jwt__Audience: atlas-literario-web
      GoogleBooks__ApiKey: ${GOOGLE_BOOKS_API_KEY:-}
      App__FrontendBaseUrl: ${FRONTEND_BASE_URL:-http://localhost:8080}
      Cors__AllowedOrigins__0: ${FRONTEND_BASE_URL:-http://localhost:8080}
      Database__ApplyMigrationsOnStartup: "true"
    ports:
      - "5080:5080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend/atlas-literario-web
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

  # Ferramenta externa de debug (não sobe com `docker compose up`): importação em lote por planilha.
  # Uso: veja tools/bulk-import/README.md
  bulk-import:
    profiles: ["tools"]
    build:
      context: ./tools/bulk-import
    environment:
      ATLAS_API_URL: http://api:5080
      ATLAS_EMAIL: ${ATLAS_EMAIL:-}
      ATLAS_PASSWORD: ${ATLAS_PASSWORD:-}
    volumes:
      - ./tools/bulk-import/data:/data

volumes:
  pgdata:
