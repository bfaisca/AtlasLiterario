server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/geo+json image/svg+xml;

  # API (serviço "api" do docker-compose). Sem URI no proxy_pass: o caminho /api/... é preservado.
  # client_max_body_size: o padrão (1 MB) rejeitaria o envio de capa (até 2 MB + multipart) com 413.
  location /api/ {
    client_max_body_size 3m;
    proxy_pass http://api:5080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Módulos ES (.mjs — ex.: worker do MapLibre). O mime.types do nginx 1.27 não mapeia .mjs e o
  # navegador recusa module workers servidos como application/octet-stream ("Worker failed to load").
  # O bloco `types` substitui o mapa herdado, por isso fica restrito a esta location.
  # Location regex tem precedência sobre o prefixo /assets/.
  location ~* \.mjs$ {
    types { application/javascript mjs; }
    default_type application/javascript;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Assets com hash: cache longo
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # GeoJSON dos países: nunca cair no fallback da SPA (404 real se ausente)
  location /geo/ {
    types { application/geo+json geojson; }
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Fallback da SPA (Vue Router em modo history)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
